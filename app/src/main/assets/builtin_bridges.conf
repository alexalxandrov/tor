# BridgePipe: встроенные (fallback) мосты Tor.
# Этот файл используется, только если CI не смог положить сюда актуальный
# файл builtin_bridges_ci из официального tor-expert-bundle.
# Строки с # — комментарии. Поддерживаются полные bridge-строки tor.
#
# Публичный snowflake-мост (работает через broker, TCP-пинг к нему не применяется):
snowflake 192.0.2.3:80 2b280b23b3d73312d7279746525f6ca0e1f9048a99f97f9fe9b8a url=https://snowflake-broker.torproject.net.global.prod.fastly.net front=cdn.sstatic.net ice=stun:stun.l.google.com:19302,stun:stun.antisip.com:3478
#
# Рекомендация: добавьте obfs4/webtunnel-мосты через вкладку «Мосты» → «Импорт»
# или свои зеркала в настройках (например, репозитории-коллекции мостов на GitHub).
