name: build-apk

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  # Версия Tor Browser, из чьего expert-bundle берутся нативные бинарники.
  # Обновляется одной строкой. Проверить актуальную: https://dist.torproject.org/torbrowser/
  TOR_BROWSER_VERSION: "15.0.26"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Необязательная подпись: если секреты не заданы, APK останется unsigned.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (предустановлен на ubuntu-раннере) + лицензии
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager не найден в $SDK"
            exit 1
          fi
          # В CI нет интерактивного ввода — отвечаем "y" на все лицензии.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "Лицензии приняты, SDK готов"

      - name: Gradle 8.9 — точная фиксация версии
        run: |
          set -euo pipefail
          # На ubuntu-раннере бывает предустановлен другой Gradle, который перебивает PATH
          # и ломает совместимость с AGP 8.5.2 / Kotlin 2.0.21. Скачиваем ровно 8.9
          # и ставим её ПЕРВОЙ в PATH, чтобы сборка была детерминированной.
          curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/gradle-8.9/bin:$PATH"
          gradle --version

      - name: Кэширование Gradle (setup-gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: Скачать tor expert-bundles (aarch64, armv7, x86_64) + checksums
        run: |
          set -euo pipefail
          V="${TOR_BROWSER_VERSION}"
          BASE="https://dist.torproject.org/torbrowser/$V"
          mkdir -p tmp-expert
          for arch in aarch64 armv7 x86_64; do
            f="tor-expert-bundle-android-$arch-$V.tar.gz"
            echo "== $f"
            curl -fsSL --retry 3 -o "tmp-expert/$f" "$BASE/$f"
          done
          curl -fsSL --retry 3 -o tmp-expert/sums.txt "$BASE/sha256sums-unsigned-build.txt"
          # В sums.txt есть и 32-битный x86-бандл, который мы не качаем —
          # проверяем только реально скачанные файлы.
          grep -E 'tor-expert-bundle-android-(aarch64|armv7|x86_64)-' tmp-expert/sums.txt > tmp-expert/expert-sums.txt
          (cd tmp-expert && sha256sum -c expert-sums.txt)
          echo "Checksums OK"

      - name: Распаковать нативные бинарники в jniLibs
        run: |
          set -euo pipefail
          V="${TOR_BROWSER_VERSION}"
          declare -A MAP=( [aarch64]=arm64-v8a [armv7]=armeabi-v7a [x86_64]=x86_64 )
          for arch in aarch64 armv7 x86_64; do
            mkdir -p "tmp-expert/$arch"
            tar -xzf "tmp-expert/tor-expert-bundle-android-$arch-$V.tar.gz" -C "tmp-expert/$arch"
            abi="${MAP[$arch]}"
            dest="app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            echo "== [$arch] содержимое бандла:"
            find "tmp-expert/$arch" -type f | sort
            # В андроид-бандле tor называется libtor.so (в старых версиях — tor).
            torbin=$(find "tmp-expert/$arch" -type f \( -iname 'tor' -o -iname 'libtor.so' -o -iname 'libtor*' \) | head -n1)
            if [ -z "$torbin" ]; then echo "ERROR: tor binary not found for $arch"; exit 1; fi
            echo "[$arch] tor: $torbin"
            cp -L "$torbin" "$dest/libtor.so"
            # Транспорты в андроид-бандле тоже лежат как .so (libLyrebird.so покрывает
            # obfs4+webtunnel+meek+snowflake, libsnowflake.so и пр.) — копируем все.
            find "tmp-expert/$arch" -type f -name '*.so' ! -name 'libtor.so' -exec cp -L {} "$dest/" \;
            # Нормализуем имена к строчным: приложение ждёт liblyrebird.so/libsnowflake.so
            # (в бандле Tor Browser используется libLyrebird.so с большой буквы).
            for f in "$dest"/*; do
              base=$(basename "$f")
              lower="$dest/$(printf '%s' "$base" | tr 'A-Z' 'a-z')"
              if [ "$base" != "libtor.so" ] && [ "$base" != "$(basename "$lower")" ] && [ ! -e "$lower" ]; then
                mv "$f" "$lower"
              fi
            done
            # На случай старых бандлов с транспорами не-.so (lyrebird, obfs4proxy, ...).
            for pat in lyrebird obfs4proxy snowflake webtunnel; do
              p=$(find "tmp-expert/$arch" -type f -name "$pat*" ! -name '*.so' | head -n1)
              if [ -n "$p" ]; then
                echo "[$arch] PT (bin): $p"
                cp -L "$p" "$dest/lib${pat}.so"
              fi
            done
            ls -la "$dest"
          done

      - name: geoip и строки мостов Tor Browser -> assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tor
          find tmp-expert -type f \( -name 'geoip' -o -name 'geoip6' \) -exec cp {} app/src/main/assets/tor/ \; || true
          bconf=$(find tmp-expert -type f -iname '*bridges*' ! -iname '*.asc' | head -n1)
          if [ -n "$bconf" ]; then
            echo "builtin bridges: $bconf"
            cp "$bconf" app/src/main/assets/tor/builtin_bridges_ci
          else
            echo "WARN: строки мостов в бандле не найдены — приложение использует assets/builtin_bridges.conf"
          fi
          ls -la app/src/main/assets/tor || true

      - name: Сборка release APK
        run: |
          set -euo pipefail
          export PATH="/tmp/gradle-8.9/bin:$PATH"
          # Полный путь задачи: если модуль :app вдруг не найдётся, сборка упадёт
          # с понятной ошибкой, а не "успешно" соберёт ничего (было видно как :noop).
          gradle :app:assembleRelease --no-daemon --stacktrace
          echo "---- результат ----"
          find app/build/outputs -type f -name '*.apk' -exec ls -la {} \;
          # Страховка: APK обязан существовать и быть непустым.
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk bridgepipe-unsigned.apk

      - name: Подписать APK для установки
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n1)

          if [ -n "${KEYSTORE_B64:-}" ]; then
            : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD is required when KEYSTORE_B64 is configured}"
            : "${KEY_ALIAS:?KEY_ALIAS is required when KEYSTORE_B64 is configured}"
            : "${KEY_PASSWORD:?KEY_PASSWORD is required when KEYSTORE_B64 is configured}"
            SIGNING_KEYSTORE="keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$SIGNING_KEYSTORE"
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
            echo "Signing APK with the configured release keystore"
          else
            # Installable test build. This temporary key is unique per run;
            # configure GitHub signing secrets for upgrades with the same certificate.
            SIGNING_KEYSTORE="/tmp/bridgepipe-ci.p12"
            CI_SIGN_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkeypair -noprompt -v \
              -storetype PKCS12 \
              -keystore "$SIGNING_KEYSTORE" \
              -storepass "$CI_SIGN_PASSWORD" \
              -keypass "$CI_SIGN_PASSWORD" \
              -alias bridgepipe-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=BridgePipe CI, OU=Development, O=BridgePipe, C=US"
            STORE_PASS="$CI_SIGN_PASSWORD"
            ALIAS="bridgepipe-ci"
            KEY_PASS="$CI_SIGN_PASSWORD"
            echo "::warning::No release signing secrets configured. APK will be signed with a temporary test key; future builds require uninstalling the previous test build before reinstalling."
          fi

          "$BT/zipalign" -f -p 4 bridgepipe-unsigned.apk bridgepipe-aligned.apk
          "$BT/apksigner" sign \
            --ks "$SIGNING_KEYSTORE" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out bridgepipe-signed.apk bridgepipe-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs bridgepipe-signed.apk
          test -s bridgepipe-signed.apk
          rm -f bridgepipe-aligned.apk
          if [ "${SIGNING_KEYSTORE:-}" = "keystore.jks" ]; then rm -f keystore.jks; else rm -f "$SIGNING_KEYSTORE"; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridgepipe-apk
          path: "bridgepipe-signed.apk"
          if-no-files-found: error
